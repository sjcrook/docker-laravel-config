user  www-data;
worker_processes  auto;

# Run in the foreground — the container's main process is startup.sh, which execs nginx.
daemon off;

pid  /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log to the container's stdout/stderr so `docker compose logs nginx` works.
    # (sites/laravel.conf additionally writes per-site logs to /var/log/nginx/.)
    access_log /dev/stdout;
    error_log /dev/stderr;

    server_tokens       off;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # No nginx-side upload cap: PHP's upload_max_filesize / post_max_size (laravel.ini,
    # set per project in docker.answers.json) are the single source of truth.
    client_max_body_size 0;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      text/plain text/css text/xml text/javascript application/javascript
                    application/json application/xml application/manifest+json image/svg+xml;

    # TLS: based on Mozilla's "intermediate" profile, trimmed to ECDHE AEAD suites (no DHE,
    # so no dhparam file is needed). TLS 1.0/1.1 are deprecated (RFC 8996) and deliberately
    # not enabled; the TLS 1.3 suites are the OpenSSL defaults. No HSTS header is sent:
    # browsers cache it per host, which is a footgun for local development domains.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # php-upstream definition (written by the Dockerfile)
    include /etc/nginx/conf.d/*.conf;

    # Project sites, rendered by startup.sh from the bind-mounted sites-available/ directory
    # (${NGINX_SERVER_NAME} etc. are substituted there). Rendering into a container-local
    # directory keeps the host's sites/laravel.conf pristine.
    include /etc/nginx/sites-enabled/*.conf;
}
