; php-fpm pool overrides for local development.
; Installed as php-fpm.d/zz-laravel.conf so it loads after the base image's zz-docker.conf.
; These are pool directives: they have no effect in a php.ini-style conf.d file.
[www]
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
request_terminate_timeout = 60s
